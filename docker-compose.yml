services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meotdc}
      POSTGRES_USER: ${POSTGRES_USER:-meotdc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - meotdc-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - meotdc-redis:/data
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meotdc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Create .env and set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - meotdc-files:/data

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - meotdc-clamav-db:/var/lib/clamav

  api:
    image: ${DOCKERHUB_USERNAME:-vuongdeptraii2k8}/meotdc-api:${MEOTDC_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-meotdc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-meotdc}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_SSL: "false"
      S3_ENDPOINT: http://minio:9000
      S3_ENABLED: "true"
      S3_BUCKET: ${S3_BUCKET:-meotdc-submissions}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-meotdc}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-false}
      FILE_SCAN_REQUIRED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      MEOTDC_WEB_ORIGINS: ${MEOTDC_WEB_ORIGINS:-${MEOTDC_WEB_ORIGIN:-http://localhost:3000}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MEOTDC_ADMIN_EMAIL: ${MEOTDC_ADMIN_EMAIL:-}
      MEOTDC_TEACHER_EMAILS: ${MEOTDC_TEACHER_EMAILS:-}
      MEOTDC_TEACHER_CLASS_ASSIGNMENTS: ${MEOTDC_TEACHER_CLASS_ASSIGNMENTS:-}
      MEOTDC_SCHOOL_EMAILS: ${MEOTDC_SCHOOL_EMAILS:-}
      MEOTDC_DOMAINS: ${MEOTDC_DOMAINS:-${MEOTDC_DOMAIN:-localhost}}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      MEOTDC_UPLOADS_DIR: /app/data/assignment-submissions
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - meotdc-uploads:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    image: ${DOCKERHUB_USERNAME:-vuongdeptraii2k8}/duantuonglai:${MEOTDC_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:4000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    profiles: [public]
    restart: unless-stopped
    environment:
      MEOTDC_DOMAINS: ${MEOTDC_DOMAINS:-${MEOTDC_DOMAIN:-localhost}}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - meotdc-caddy-data:/data
      - meotdc-caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  meotdc-postgres:
  meotdc-redis:
  meotdc-files:
  meotdc-clamav-db:
  meotdc-uploads:
  meotdc-caddy-data:
  meotdc-caddy-config:
